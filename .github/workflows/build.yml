# I don't have the Android SDK on my machine, so GitHub builds the APK for me.
# Run it from the Actions tab (Run workflow) or just push to main.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# The build only needs to read my code. Nothing here can write to the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # I pin the image. ubuntu-latest is moving to a new Ubuntu and I know 24.04 ships the Android SDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # I only build a signed release when I have added all four signing secrets.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      # I pin every action to a full commit SHA so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner already has an SDK. I only accept the licenses so Gradle can fetch any missing platform.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        # The website upload can drop the executable bit, so I run the wrapper through sh.
        run: sh gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persian-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          sh gradlew --no-daemon assembleRelease
          rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: persian-bridge-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
